<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Pessoal | Malu Girelli</title>
    
    <link rel="stylesheet" href="style.css"> 
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
    
    <style>
      @view-transition { navigation: auto; }
      
      /* Efeito visual para indicar que a imagem é um botão */
      .img-link {
        display: block;
        transition: transform 0.3s ease;
      }
      .img-link:hover {
        transform: scale(1.02);
        filter: brightness(0.9);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1 id="site-title">Malu Girelli</h1>
        <p class="subtitle" id="site-subtitle">Corajosa e Chorona</p>

        <div class="social-links">
            <a href="https://www.instagram.com/malu.girelli?igsh=MjJreWtnc3JtaHpz" target="_blank" class="social-icon" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://wa.me/qr/3U5O6Q4ARMHDJ1" target="_blank" class="social-icon" aria-label="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="SEU_LINKEDIN_AQUI" target="_blank" class="social-icon" aria-label="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="https://github.com/Maluzet3" target="_blank" class="social-icon" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </div>
        
        <nav>
          <button class="nav-btn active" data-page="about">Sobre Mim</button>
          <button class="nav-btn" data-page="course">Meu Curso</button>
          <button class="nav-btn" data-page="friends">Meus Amigos</button>
          <button class="nav-btn" data-page="family">Minha Família</button>
          <button class="nav-btn" data-page="dreams">Meus Sonhos</button>
        </nav>
      </header>

      <main>
       <div class="photo-placeholder large">
    <img src="eu.jpg" alt="Foto principal" class="page-image" onclick="mostrarPagina('detalhes-foto')" style="cursor:pointer;">
    <div class="photo-caption">Clique para ver detalhes</div> 
</div>

<div id="detalhes-foto" class="page">
    <button onclick="mostrarPagina('about')" class="nav-btn" style="margin-bottom: 20px;">
        <i class="fas fa-arrow-left"></i> Voltar
    </button>
    
    <h2 class="section-title">Detalhes da Foto</h2>
    <div class="photo-grid">
        <img src="eu.jpg" style="width: 100%; border-radius: 15px;">
        <p class="content-text">Aqui você pode escrever um texto maior sobre essa foto ou parte específica do seu site!</p>
    </div>
</div>

            <div class="photo-placeholder">
              <img src="niver.jpg" alt="Momentos especiais" class="page-image">
              <div class="photo-caption">Momentos especiais</div> 
            </div>
            
            <div class="photo-placeholder">
              <img src="medalha.jpg" alt="Minhas conquistas" class="page-image">
              <div class="photo-caption">Minhas conquistas</div> 
            </div>

            <div class="photo-placeholder">
              <img src="cafe.jpg" alt="Minhas paixões" class="page-image">
              <div class="photo-caption">Minhas paixões</div> 
            </div>
          </div>
        </div>

        </main>
    </div>

    <script src="script.js"></script> 
  </body>
</html>
